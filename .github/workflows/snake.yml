name: Contribution snake

# Redraws the contribution snake on the `output` branch once a day and on every
# push to main, so the profile README's last image stays current. It writes
# nothing else and needs only the default token.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw the snake
        uses: Platane/snk@v3
        with:
          github_user_name: kavatana
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=F59B3C

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
