<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930">
<rect x="0" y="0" width="1440" height="930" rx="12" fill="#F3F7F8" stroke="#F3F7F8"/>
<text x="54" y="54" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#176C78" font-weight="700">CHNAI LAB  /  MISSION EXPERIENCE BLUEPRINT</text>
<text x="54" y="115" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#17313F" font-weight="700">One system, separate responsibilities</text>
<text x="54" y="154" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#526A76" font-weight="400">PROPOSED DESIGN  /  Synthetic operational scenario and real research data stay distinct.</text>
<line x1="414" y1="296" x2="470" y2="296" stroke="#9DB3BE" stroke-width="2"/>
<line x1="830" y1="296" x2="886" y2="296" stroke="#9DB3BE" stroke-width="2"/>
<line x1="234" y1="382" x2="234" y2="460" stroke="#9DB3BE" stroke-width="2"/>
<line x1="414" y1="551" x2="470" y2="551" stroke="#9DB3BE" stroke-width="2"/>
<line x1="650" y1="460" x2="650" y2="382" stroke="#9DB3BE" stroke-width="2"/>
<line x1="1136" y1="382" x2="1136" y2="460" stroke="#9DB3BE" stroke-width="2"/>
<rect x="54" y="210" width="360" height="172" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="76" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">1  Gather and qualify</text>
<text x="76" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Device / file / private observation</text>
<text x="76" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Identity, units, method, time, quality</text>
<text x="76" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Raw evidence + qualified observations</text>
<rect x="470" y="210" width="360" height="172" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="492" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">2  Evaluate locally</text>
<text x="492" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Versioned applicability and comparison</text>
<text x="492" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Explicit gaps and uncertainty</text>
<text x="492" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Optional cited explanation</text>
<rect x="886" y="210" width="500" height="172" rx="12" fill="#17313F" stroke="#17313F"/>
<text x="908" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#FFFFFF" font-weight="700">3  Review and act</text>
<text x="908" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Crew + authorized medical reviewer</text>
<text x="908" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Owned follow-up and actual outcome</text>
<text x="908" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Private, scoped evidence release</text>
<rect x="54" y="460" width="360" height="182" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="76" y="499" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Research workspace</text>
<text x="76" y="533" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Study subjects and processed files</text>
<text x="76" y="558" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Rights, provenance and import reports</text>
<text x="76" y="583" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Never relabeled as live crew</text>
<rect x="470" y="460" width="360" height="182" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="492" y="499" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Shared evidence layer</text>
<text x="492" y="533" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Pinned source / rule / adapter versions</text>
<text x="492" y="558" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Append-only revisions and audit trail</text>
<text x="492" y="583" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Research qualifies a method, not a person</text>
<rect x="886" y="460" width="500" height="182" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="908" y="499" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Earth handoff</text>
<text x="908" y="533" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Outbox &gt; transmission &gt; receipt &gt; review</text>
<text x="908" y="558" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Each state visible; delays are explicit</text>
<text x="908" y="583" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Delivery does not complete care</text>
<rect x="54" y="703" width="1332" height="90" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="76" y="742" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Independent failure domains</text>
<text x="76" y="776" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Wearable or recorder     |     Tablet / local network     |     Local service     |     Earth link</text>
<rect x="54" y="829" width="1332" height="59" rx="12" fill="#E7F0F2" stroke="#E7F0F2"/>
<text x="75" y="863" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#176C78" font-weight="400">A clinical record, a research subject, a device and an explanation are different kinds of evidence.</text>
</svg>