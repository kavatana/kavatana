<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930">
<rect x="0" y="0" width="1440" height="930" rx="12" fill="#F3F7F8" stroke="#F3F7F8"/>
<text x="54" y="54" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#176C78" font-weight="700">CHNAI LAB  /  MISSION EXPERIENCE BLUEPRINT</text>
<text x="54" y="115" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#17313F" font-weight="700">A simulation laboratory before a 3D game</text>
<text x="54" y="154" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#526A76" font-weight="400">PROPOSED DESIGN  /  Test software decisions and failures; do not claim to simulate human physiology.</text>
<line x1="414" y1="305" x2="470" y2="305" stroke="#9DB3BE" stroke-width="2"/>
<line x1="830" y1="305" x2="886" y2="305" stroke="#9DB3BE" stroke-width="2"/>
<line x1="650" y1="400" x2="650" y2="442" stroke="#9DB3BE" stroke-width="2"/>
<line x1="650" y1="442" x2="234" y2="442" stroke="#9DB3BE" stroke-width="2"/>
<line x1="234" y1="442" x2="234" y2="484" stroke="#9DB3BE" stroke-width="2"/>
<line x1="650" y1="442" x2="650" y2="484" stroke="#9DB3BE" stroke-width="2"/>
<line x1="650" y1="442" x2="1136" y2="442" stroke="#9DB3BE" stroke-width="2"/>
<line x1="1136" y1="442" x2="1136" y2="484" stroke="#9DB3BE" stroke-width="2"/>
<rect x="54" y="210" width="360" height="190" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="76" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Scenario package</text>
<text x="76" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Seed + virtual clock + mission context</text>
<text x="76" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Crew roles, grants and fixture provenance</text>
<text x="76" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Faults, expected events, reset rules</text>
<text x="76" y="358" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">All new scenarios: Not run</text>
<rect x="470" y="210" width="360" height="190" rx="12" fill="#17313F" stroke="#17313F"/>
<text x="492" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#FFFFFF" font-weight="700">Deterministic runner</text>
<text x="492" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Replay device/file events through adapters</text>
<text x="492" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Inject link, storage and identity failures</text>
<text x="492" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Record actual events and assertions</text>
<text x="492" y="358" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#D7E7EE" font-weight="400">Use the same domain logic as the app</text>
<rect x="886" y="210" width="500" height="190" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="908" y="249" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">Independent test oracle</text>
<text x="908" y="283" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Expected properties from scenario spec</text>
<text x="908" y="308" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Check privacy, ownership and recovery</text>
<text x="908" y="333" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Report observed versus expected behavior</text>
<text x="908" y="358" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Do not derive truth from the app output</text>
<rect x="54" y="484" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="76" y="523" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">View A: 2D control room</text>
<text x="76" y="557" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Timeline, scenario cards and fault controls</text>
<text x="76" y="582" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Fast-forward, pause, replay and reset</text>
<text x="76" y="607" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Inspect payloads and assertion results</text>
<text x="76" y="632" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">First interface to build</text>
<rect x="470" y="484" width="360" height="220" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="492" y="523" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">View B: optional 3D habitat</text>
<text x="492" y="557" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Berth / exercise / work / medical zones</text>
<text x="492" y="582" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Spatial context and device status</text>
<text x="492" y="607" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Event markers linked to the real task UI</text>
<text x="492" y="632" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Renderer never owns clinical rules</text>
<rect x="886" y="484" width="500" height="220" rx="12" fill="#FFFFFF" stroke="#D5E0E5"/>
<text x="908" y="523" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#176C78" font-weight="700">View C: crew + ground app</text>
<text x="908" y="557" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Exercise the actual brief, review and outbox</text>
<text x="908" y="582" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Separate personas with scoped access</text>
<text x="908" y="607" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Observe the same scenario state</text>
<text x="908" y="632" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#526A76" font-weight="400">Accessible 2D path remains available</text>
<rect x="54" y="829" width="1332" height="59" rx="12" fill="#E7F0F2" stroke="#E7F0F2"/>
<text x="75" y="863" font-family="DejaVu Sans,sans-serif" font-size="15" fill="#176C78" font-weight="400">3D earns its place only if it improves scenario understanding or exposes a failure the 2D harness misses.</text>
</svg>