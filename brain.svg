<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Vatana Brain: products, the studio, skills, agents, and current focus orbiting one center">
  <title>Vatana Brain</title>
  <desc>An animated map of what Ka Vatana runs: six product tracks, one student studio, five skill areas, three agent layers, and current focus, orbiting a black-hole core. The live version is on kavatana.me.</desc>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A54B" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#E8A54B" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#E8A54B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizon" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#E8A54B" stop-opacity="0"/>
      <stop offset="84%" stop-color="#E8A54B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF1D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A54B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFE6BC" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E8A54B" stop-opacity="0"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#F7F3EF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="320" rx="14" fill="#0F0E0D"/>
  <rect width="1000" height="320" rx="14" fill="url(#grid)"/>

  <!-- stars -->
  <g fill="#D8CFC4" opacity="0.55">
    <circle cx="62" cy="48" r="1"/><circle cx="130" cy="252" r="0.8"/><circle cx="212" cy="90" r="1.1"/><circle cx="300" cy="280" r="0.7"/>
    <circle cx="352" cy="36" r="0.9"/><circle cx="640" cy="52" r="1"/><circle cx="710" cy="284" r="0.8"/><circle cx="790" cy="120" r="0.7"/>
    <circle cx="866" cy="44" r="1.1"/><circle cx="930" cy="230" r="0.9"/><circle cx="960" cy="90" r="0.7"/><circle cx="470" cy="300" r="0.8"/>
    <circle cx="560" cy="24" r="0.7"/><circle cx="820" cy="270" r="1"/><circle cx="180" cy="180" r="0.6"/><circle cx="910" cy="160" r="0.6"/>
  </g>

  <!-- the core -->
  <g transform="translate(500 160)">
    <circle r="150" fill="url(#glow)"/>
    <!-- accretion disc, seen at a tilt -->
    <g transform="rotate(-14)">
      <ellipse rx="112" ry="26" fill="none" stroke="url(#disc)" stroke-width="10" opacity="0.55" filter="url(#bloom)"/>
      <ellipse rx="112" ry="26" fill="none" stroke="url(#disc)" stroke-width="2.5" opacity="0.95"/>
      <g fill="#FFE6BC">
        <circle r="1.6"><animateMotion dur="9s" repeatCount="indefinite" path="M112 0 A112 26 0 1 1 -112 0 A112 26 0 1 1 112 0"/></circle>
        <circle r="1.2" opacity="0.8"><animateMotion dur="13s" begin="-4s" repeatCount="indefinite" path="M96 0 A96 22 0 1 1 -96 0 A96 22 0 1 1 96 0"/></circle>
        <circle r="1.3" opacity="0.7"><animateMotion dur="11s" begin="-7s" repeatCount="indefinite" path="M126 0 A126 30 0 1 1 -126 0 A126 30 0 1 1 126 0"/></circle>
      </g>
    </g>
    <circle r="44" fill="url(#horizon)" filter="url(#bloom)"/>
    <circle r="34" fill="#000"/>
    <circle r="34.5" fill="none" stroke="#E8A54B" stroke-opacity="0.9" stroke-width="1"/>
    <text y="62" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="2.4" fill="#B9B2AA">KA VATANA</text>
  </g>

  <!-- orbits: one ring per source, each turning at its own pace -->
  <g transform="translate(500 160)" fill="none" stroke-opacity="0.16" stroke-width="1">
    <circle r="98" stroke="#1E9DBC"/>
    <circle r="124" stroke="#E8A54B" stroke-dasharray="2 5"/>
    <circle r="150" stroke="#C650B8"/>
    <circle r="176" stroke="#5FB3A0" stroke-dasharray="2 5"/>
    <circle r="202" stroke="#8E97AB"/>
  </g>

  <!-- products and proof: cyan, 8 -->
  <g transform="translate(500 160)">
    <g fill="#1E9DBC">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      <circle cx="98" cy="0" r="4.2"/><circle cx="-98" cy="0" r="3"/><circle cx="0" cy="98" r="3.4"/><circle cx="0" cy="-98" r="2.8"/>
      <circle cx="69" cy="69" r="3.2"/><circle cx="-69" cy="-69" r="2.6"/><circle cx="-69" cy="69" r="2.9"/><circle cx="69" cy="-69" r="3.6"/>
    </g>
    <!-- studio: amber, the hub -->
    <g fill="#E8A54B">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="72s" repeatCount="indefinite"/>
      <circle cx="124" cy="0" r="6.5"/><circle cx="124" cy="0" r="10" fill="none" stroke="#E8A54B" stroke-opacity="0.7" stroke-width="1"/>
    </g>
    <!-- skills: magenta, 5 -->
    <g fill="#C650B8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="88s" repeatCount="indefinite"/>
      <circle cx="150" cy="0" r="3.2"/><circle cx="46" cy="143" r="3"/><circle cx="-121" cy="88" r="3.4"/><circle cx="-121" cy="-88" r="2.8"/><circle cx="46" cy="-143" r="3.1"/>
    </g>
    <!-- agents: teal, 3 -->
    <g fill="#5FB3A0">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="104s" repeatCount="indefinite"/>
      <circle cx="176" cy="0" r="3.4"/><circle cx="-88" cy="152" r="3"/><circle cx="-88" cy="-152" r="3"/>
    </g>
    <!-- now: grey-blue, 5 -->
    <g fill="#8E97AB">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="130s" repeatCount="indefinite"/>
      <circle cx="202" cy="0" r="2.6"/><circle cx="62" cy="192" r="2.4"/><circle cx="-163" cy="119" r="2.8"/><circle cx="-163" cy="-119" r="2.4"/><circle cx="62" cy="-192" r="2.6"/>
    </g>
  </g>

  <!-- legend, left -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#B9B2AA">
    <text x="56" y="70" font-size="11" letter-spacing="2.2" fill="#7E7770" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">VATANA BRAIN</text>
    <text x="56" y="98" font-size="20" font-weight="700" fill="#F7F3EF" letter-spacing="-0.4">Everything I run, in one map.</text>
    <g transform="translate(56 132)">
      <circle cx="4" cy="-4" r="4" fill="#1E9DBC"/><text x="16" y="0">Products &amp; proof</text><text x="200" y="0" text-anchor="end" fill="#7E7770" font-family="ui-monospace, Menlo, monospace" font-size="11">8</text>
      <circle cx="4" cy="20" r="4" fill="#E8A54B"/><text x="16" y="24">Studio</text><text x="200" y="24" text-anchor="end" fill="#7E7770" font-family="ui-monospace, Menlo, monospace" font-size="11">1</text>
      <circle cx="4" cy="44" r="4" fill="#C650B8"/><text x="16" y="48">Skills</text><text x="200" y="48" text-anchor="end" fill="#7E7770" font-family="ui-monospace, Menlo, monospace" font-size="11">5</text>
      <circle cx="4" cy="68" r="4" fill="#5FB3A0"/><text x="16" y="72">Agents</text><text x="200" y="72" text-anchor="end" fill="#7E7770" font-family="ui-monospace, Menlo, monospace" font-size="11">3</text>
      <circle cx="4" cy="92" r="4" fill="#8E97AB"/><text x="16" y="96">Now</text><text x="200" y="96" text-anchor="end" fill="#7E7770" font-family="ui-monospace, Menlo, monospace" font-size="11">5</text>
    </g>
    <text x="56" y="262" font-size="11" fill="#7E7770">Live and interactive on kavatana.me</text>
  </g>

  <!-- right: the three rules -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" fill="#B9B2AA" font-size="12.5">
    <text x="944" y="70" text-anchor="end" font-size="11" letter-spacing="2.2" fill="#7E7770" font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">HOW I WORK</text>
    <text x="944" y="104" text-anchor="end" fill="#F7F3EF" font-weight="600">Evidence before status</text>
    <text x="944" y="124" text-anchor="end">Live, local, simulated, planned: named as such.</text>
    <text x="944" y="156" text-anchor="end" fill="#F7F3EF" font-weight="600">People stay accountable</text>
    <text x="944" y="176" text-anchor="end">A person owns judgment, review, and the ship.</text>
    <text x="944" y="208" text-anchor="end" fill="#F7F3EF" font-weight="600">AI stays bounded</text>
    <text x="944" y="228" text-anchor="end">Scoped context, never secrets, always reviewable.</text>
  </g>
</svg>
