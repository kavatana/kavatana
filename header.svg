<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Ka Vatana — founder-engineer, Cambodia">
  <title>Ka Vatana — founder-engineer, Cambodia</title>

  <defs>
    <!-- Palette lifted from the portfolio's own design/tokens.md so the profile
         and the site read as one identity rather than two. -->
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F59B3C" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#F59B3C" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#F59B3C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#F59B3C" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F59B3C" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59B3C" stop-opacity="0"/>
    </radialGradient>

    <!-- One grid cell, tiled. 44px matches the rhythm used across the products. -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#F7F3EF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>

    <mask id="fade">
      <rect width="1000" height="220" fill="url(#fademask)"/>
    </mask>
    <linearGradient id="fademask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="220" rx="14" fill="#0F0E0D"/>
  <rect width="1000" height="220" rx="14" fill="url(#grid)" mask="url(#fade)"/>

  <!-- Two slow blooms on coprime periods, so they never resynchronise into a
       visible pulse. -->
  <g opacity="0.9">
    <circle cx="180" cy="70" r="150" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 26 18; 0 0" dur="19s" repeatCount="indefinite"/>
    </circle>
    <circle cx="830" cy="160" r="170" fill="url(#glow)">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -22 -14; 0 0" dur="23s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="86" fill="#F7F3EF" font-size="52" font-weight="700" letter-spacing="-1.4">
      Ka Vatana
    </text>

    <!-- The rule draws itself once on load, then stays. -->
    <rect x="64" y="106" width="0" height="3" rx="1.5" fill="url(#rule)">
      <animate attributeName="width" from="0" to="420" dur="1.1s"
        begin="0.15s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1"/>
    </rect>

    <text x="64" y="140" fill="#B9B2AA" font-size="18" font-weight="500" letter-spacing="0.2">
      Founder-engineer · Cambodia
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="0.7s" fill="freeze"/>
    </text>

    <text x="64" y="172" fill="#7E7770" font-size="14.5" font-weight="400">
      Products for a market that is usually built for last.
      <animate attributeName="opacity" from="0" to="1" dur="0.7s" begin="1.0s" fill="freeze"/>
    </text>

    <!-- Status chip: the dot breathes rather than blinks, which reads as alive
         without demanding attention. -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.3s" fill="freeze"/>
      <rect x="782" y="52" width="156" height="30" rx="15" fill="#F59B3C" fill-opacity="0.1" stroke="#F59B3C" stroke-opacity="0.34"/>
      <circle cx="801" cy="67" r="3.6" fill="#F59B3C">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text x="814" y="72" fill="#F0B472" font-size="12.5" font-weight="600" letter-spacing="0.9">
        OPEN TO WORK
      </text>
    </g>
  </g>
</svg>
